name: Upstream snapshots

on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream

jobs:
  sync:
    name: Merge the latest snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/create-github-app-token@v3
        id: insight
        with:
          client-id: ${{ secrets.INSIGHT_CLIENT_ID }}
          private-key: ${{ secrets.INSIGHT_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: read

      - name: Merge the latest snapshot
        env:
          GH_TOKEN: ${{ github.token }}
          INSIGHT_TOKEN: ${{ steps.insight.outputs.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          before="$(git rev-parse origin/upstream)"
          git fetch -q origin upstream:upstream
          tools/train-rerere.sh origin/main upstream
          git checkout -q -B sync origin/main
          if tools/sync-upstream.sh --merge; then clean=true; else clean=false; git merge --abort; fi
          [ "$(git rev-parse upstream)" = "$before" ] && exit 0

          git push origin upstream
          title="Merge $(git log -1 --format=%s upstream | sed 's/^chore: publish d2web source //')"
          gh pr list --state open --json number,headRefName -q '.[] | select(.headRefName | startswith("sync/")) | .number' | xargs -r -n1 gh pr close --delete-branch
          if $clean; then
            branch="sync/$(git rev-parse --short upstream)"
            git push origin "HEAD:refs/heads/$branch"
            GH_TOKEN="$INSIGHT_TOKEN" gh pr create --base main --head "$branch" --title "$title" --body ""
            for _ in $(seq 30); do
              sleep 10
              [ -n "$(gh pr checks "$branch" --json name -q '.[].name' 2> /dev/null)" ] && break
            done
            if gh pr checks "$branch" --watch --fail-fast > /dev/null; then
              git push origin HEAD:main && git push origin --delete "$branch" && gh workflow run ci.yml --ref main && gh workflow run upstream-tests.yml --ref main && echo "CI passed, merged into main"
              tools/release-snapshot.sh
            else
              GH_TOKEN="$INSIGHT_TOKEN" gh pr comment "$branch" --body "CI failed, so this was left for review."
            fi
          else
            branch="sync/$(git rev-parse --short upstream)-conflicts"
            git push origin "upstream:refs/heads/$branch"
            GH_TOKEN="$INSIGHT_TOKEN" gh pr create --base main --head "$branch" --title "$title (conflicts)" --body ""
          fi
