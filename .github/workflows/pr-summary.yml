name: Horadric Insight

on:
  pull_request:
    types: [opened, reopened, synchronize]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-summary-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

jobs:
  summarize:
    name: Write the PR description
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/create-github-app-token@v3
        id: insight
        continue-on-error: true
        with:
          client-id: ${{ secrets.INSIGHT_CLIENT_ID }}
          private-key: ${{ secrets.INSIGHT_PRIVATE_KEY }}
          permission-pull-requests: write
          permission-contents: read
      - name: Write the summary into the PR body
        env:
          GH_TOKEN: ${{ github.token }}
          INSIGHT_TOKEN: ${{ steps.insight.outputs.token || github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ vars.AWS_REGION }}
          SUMMARY_MODEL: ${{ secrets.SUMMARY_MODEL }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          gh pr view "$PR" --json body,title,baseRefName > pr.json
          git fetch -q origin "pull/$PR/head:pr-head"
          base="$(git merge-base "origin/$(jq -r .baseRefName pr.json)" pr-head)"
          PR_BODY="$(jq -r '.body // ""' pr.json)" node tools/pr-summary.ts "$base" pr-head "$(jq -r .title pr.json)" > body.md
          if [ -s body.md ]; then GH_TOKEN="$INSIGHT_TOKEN" gh pr edit "$PR" --body-file body.md; fi
