name: Checks

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '7 6 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Types, mod tests and lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: git branch upstream origin/upstream
      - run: npm run typecheck
      - run: npm run test:mods -- --reporter=default --reporter=json --outputFile.json=mod-tests.json
      - run: tools/lint-mods.sh
      - run: node tools/badges.ts check badges mod-tests.json
      - uses: actions/upload-artifact@v7
        with:
          name: badges-check
          path: badges

  build:
    name: Production build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node tools/badges.ts build badges dist
      - uses: actions/upload-artifact@v7
        with:
          name: badges-build
          path: badges

  lint:
    name: Workflow and shell lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash <(curl -sSL https://raw.githubusercontent.com/rhysd/actionlint/v1.7.7/scripts/download-actionlint.bash) 1.7.7
      - run: ./actionlint
      - run: shellcheck -e SC2016 tools/sync-upstream.sh tools/test-mods.sh tools/lint-mods.sh tools/release-snapshot.sh tools/train-rerere.sh

  badges:
    name: Publish README badges
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [check, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: badges-*
          merge-multiple: true
          path: badges
      - name: Push the badge data to the badges branch
        working-directory: badges
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git init -q -b badges
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add ./*.json
          git commit -qm 'Update badges'
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
